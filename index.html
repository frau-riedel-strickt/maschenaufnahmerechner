<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f5f1">
<title>Maschenaufnahmerechner | Frau Riedel strickt</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#202b32;background:#f6f5f1}*{box-sizing:border-box}body{margin:0;padding:30px 16px}main{max-width:680px;margin:auto}.language{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}.language button{background:white;border:1px solid #abb8bd;border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:650}.language button[aria-pressed="true"]{background:#16495d;color:white;border-color:#16495d}header{text-align:center;margin:22px 0 30px}.eyebrow{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:#667a82}h1{font-size:clamp(2rem,6vw,3rem);margin:8px 0}p{line-height:1.55;color:#53626a}.card{background:#fff;border:1px solid #e2e6e6;border-radius:18px;padding:clamp(20px,5vw,34px);box-shadow:0 8px 28px #26363d0a}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:25px 0}label{display:block;font-size:.92rem;font-weight:650;margin-bottom:9px}input{width:100%;padding:13px 14px;border:1px solid #abb8bd;border-radius:9px;font-size:1.1rem}input:focus{outline:2px solid #396b83;outline-offset:2px}.hint{font-size:.85rem;color:#65747b;margin-top:8px}.result{border-top:1px solid #e4e9e9;margin-top:22px;padding-top:22px}h2{font-size:1.3rem}.numbers{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:120px;background:#eff4f5;padding:14px;border-radius:10px}.stat strong{display:block;font-size:1.7rem}.stat span{font-size:.82rem;color:#53626a}.sequence{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}.step{display:inline-flex;align-items:center;justify-content:center;width:28px;height:30px;border-radius:5px;font-weight:700;font-size:.9rem}.pick{background:#cbe2e8;color:#16495d}.skip{background:#f1eee8;color:#746b5d}.legend{font-size:.82rem;color:#53626a}.instructions{background:#f6f8f8;padding:14px 18px;border-radius:10px;line-height:1.65}.error{color:#a62e37;font-weight:600}.foot{text-align:center;font-size:.82rem;margin:25px 0;color:#66747b}@media(max-width:600px){.fields{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<nav class="language" aria-label="Language / Sprache"><button type="button" id="de" aria-pressed="false">DE</button><button type="button" id="en" aria-pressed="false">EN</button></nav>
<header><div class="eyebrow">Frau Riedel strickt</div><h1 data-i18n="title">Maschenaufnahmerechner</h1><p data-i18n="intro">Berechne die gleichmäßige Maschenaufnahme für beide Seitenkanten.</p></header>
<section class="card"><div class="fields"><div><label for="rows" data-i18n="rows">Gestrickte Reihen</label><input id="rows" type="number" min="0" step="1" value="58" inputmode="numeric"></div><div><label for="stitches1" data-i18n="stitches1">Maschen Seitenkante 1</label><input id="stitches1" type="number" min="2" step="1" value="36" inputmode="numeric"><div class="hint" data-i18n="stitchHint1">Wert K aus deiner Anleitung</div></div><div><label for="stitches2" data-i18n="stitches2">Maschen Seitenkante 2</label><input id="stitches2" type="number" min="2" step="1" value="36" inputmode="numeric"><div class="hint" data-i18n="stitchHint2">Wert L aus deiner Anleitung</div></div></div><div id="output" aria-live="polite"></div></section>
<div class="foot" data-i18n="footer">© Frau Riedel strickt · Maschenaufnahme an der Kante</div></main>
<script>
const translations={
 de:{title:'Maschenaufnahmerechner',intro:'Berechne die gleichmäßige Maschenaufnahme für beide Seitenkanten.',rows:'Gestrickte Reihen',stitches1:'Maschen Seitenkante 1',stitches2:'Maschen Seitenkante 2',stitchHint1:'Wert K aus deiner Anleitung',stitchHint2:'Wert L aus deiner Anleitung',footer:'© Frau Riedel strickt · Maschenaufnahme an der Kante',error:'Bitte gültige ganze Zahlen eingeben. Pro Seitenkante müssen mindestens 2 Maschen aufgenommen werden (je eine in der ersten und letzten Reihe). Die Maschenzahl darf die Reihenanzahl einschließlich der 2 zusätzlichen Reihen nicht überschreiten (maximal 10.000 Reihen).',result:'Dein Ergebnis',shared:'Aufnahmefrequenz für beide Seitenkanten',edge1:'Aufnahmefrequenz Seitenkante 1',edge2:'Aufnahmefrequenz Seitenkante 2',rowWord:'Reihen',knitted:'gestrickte Reihen',extra:'zusätzliche Reihen (aus dem Abschnitt „Verkürzte Reihen“)',pick:'Maschen aufnehmen',skip:'Reihen überspringen',sequence:'Genaue Aufnahmefolge',explain:'Arbeite die Reihen von Anfang bis Ende in der angezeigten Reihenfolge ab. Pro markierter Reihe wird eine Masche aufgenommen.',row:'Reihe',pickOne:'Masche aufnehmen',skipOne:'überspringen',legend:'● = 1 Masche aufnehmen &nbsp; · &nbsp; – = Reihe überspringen',exact:'Es werden genau {picks} Maschen über {total} Reihen aufgenommen. Die erste und die letzte Reihe enthalten immer eine Aufnahme. Beginne an der Seite, von der aus du die Reihen zählst.',aria:'{picks} Aufnahmen gleichmäßig auf {total} Reihen verteilt'},
 en:{title:'Stitch Pick-Up Calculator',intro:'Calculate how to distribute picked-up stitches evenly along both side edges.',rows:'Rows knitted',stitches1:'Stitches for side edge 1',stitches2:'Stitches for side edge 2',stitchHint1:'Value K from your pattern',stitchHint2:'Value L from your pattern',footer:'© Frau Riedel strickt · Picking up stitches along an edge',error:'Please enter valid whole numbers. Each side edge requires at least 2 stitches (one in the first and one in the last row). The number of stitches cannot exceed the number of rows including the 2 additional rows (maximum 10,000 rows).',result:'Your result',shared:'Pick-up sequence for both side edges',edge1:'Pick-up sequence for side edge 1',edge2:'Pick-up sequence for side edge 2',rowWord:'rows',knitted:'rows knitted',extra:'additional rows (from the “Short Rows” section)',pick:'Stitches to pick up',skip:'Rows to skip',sequence:'Exact pick-up sequence',explain:'Follow the rows from beginning to end in the order shown. Pick up one stitch in each marked row.',row:'row',pickOne:'pick up a stitch',skipOne:'skip',legend:'● = pick up 1 stitch &nbsp; · &nbsp; – = skip row',exact:'Exactly {picks} stitches are picked up over {total} rows. Always pick up one stitch in both the first and last row. Start at the edge from which you count the rows.',aria:'{picks} stitches distributed evenly across {total} rows'}
};
const params=new URLSearchParams(location.search);
const requested=params.get('lang');
let lang=(requested==='de'||requested==='en')?requested:(navigator.language.toLowerCase().startsWith('de')?'de':'en');
const rowsInput=document.getElementById('rows'),stitches1Input=document.getElementById('stitches1'),stitches2Input=document.getElementById('stitches2'),output=document.getElementById('output');
function setLanguage(next){lang=next;document.documentElement.lang=lang;document.title=translations[lang].title+' | Frau Riedel strickt';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=translations[lang][el.dataset.i18n]);for(const code of ['de','en'])document.getElementById(code).setAttribute('aria-pressed',String(code===lang));const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState(null,'',url);render();}
function makeSequence(stitches,total,t,heading){
 // Exactly one pick-up in the first and last row; distribute all other pick-ups evenly.
 const steps=Array(total).fill(false);
 for(let k=0;k<stitches;k++)steps[Math.round(k*(total-1)/(stitches-1))]=true;
 const skipped=total-stitches;
 const runs=[];
 for(const pick of steps){const last=runs[runs.length-1];if(last&&last.pick===pick)last.count++;else runs.push({pick,count:1});}
 const fullText=runs.map(x=>lang==='de'?`${x.count} ${x.count===1?'Reihe':'Reihen'} ${x.pick?t.pickOne:t.skipOne}`:`${x.pick?'Pick up stitches in':'Skip'} ${x.count} ${x.count===1?'row':'rows'}`).join(' · ');
 const cells=steps.map((pick,i)=>`<span class="step ${pick?'pick':'skip'}" title="${t.row} ${i+1}: ${pick?t.pickOne:t.skipOne}" aria-label="${t.row} ${i+1}: ${pick?t.pickOne:t.skipOne}">${pick?'●':'–'}</span>`).join('');
 const exact=t.exact.replace('{picks}',stitches).replace('{total}',total),aria=t.aria.replace('{picks}',stitches).replace('{total}',total);
 return `<section><h2>${heading}</h2><div class="numbers"><div class="stat"><strong>${stitches}</strong><span>${t.pick}</span></div><div class="stat"><strong>${skipped}</strong><span>${t.skip}</span></div></div><h3>${t.sequence}</h3><p>${t.explain}</p><div class="sequence" role="img" aria-label="${aria}">${cells}</div><p class="legend">${t.legend}</p><div class="instructions">${fullText}</div><p class="hint">${exact}</p></section>`;
}
function render(){
 const t=translations[lang],values=[rowsInput,stitches1Input,stitches2Input].map(el=>el.value.trim());
 const [rows,s1,s2]=values.map(Number),total=rows+2;
 if(values.some(x=>x==='')||![rows,s1,s2].every(Number.isSafeInteger)||rows<0||s1<2||s2<2||s1>total||s2>total||total>10000){output.innerHTML=`<p class="error">${t.error}</p>`;return;}
 const same=s1===s2;
 output.innerHTML=`<div class="result"><h2>${t.result}</h2><p>${rows} ${t.knitted} + 2 ${t.extra} = <strong>${total} ${t.rowWord}</strong>.</p>${makeSequence(s1,total,t,same?t.shared:t.edge1)}${same?'':makeSequence(s2,total,t,t.edge2)}</div>`;
}
for(const code of ['de','en'])document.getElementById(code).addEventListener('click',()=>setLanguage(code));
for(const input of [rowsInput,stitches1Input,stitches2Input])input.addEventListener('input',render);
setLanguage(lang);
</script></body></html>
